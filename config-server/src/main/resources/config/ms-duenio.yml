server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dueno_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ms-duenio
    description: Microservicio de gestión de dueños - Patitas Felices
    version: "1.0.0"
